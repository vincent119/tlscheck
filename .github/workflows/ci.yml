name: 跨平台檢查
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
jobs:
  native:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - name: 格式與靜態檢查
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          git diff --check
          tests=()
          for file in scripts/test_*.py; do
            if [[ "$file" != scripts/test_html_acceptance.py ]]; then
              tests+=("$file")
            fi
          done
          python3 -B -m unittest -v "${tests[@]}"
      - name: 確認 PowerShell 引擎
        run: pwsh -NoProfile -NonInteractive -Command "\$PSVersionTable.PSVersion.ToString()"
      - name: 原生測試 JSON 事件
        run: |
          set -o pipefail
          go test -json -count=1 ./... | tee go-test.jsonl
      - name: Race 測試 JSON 事件
        run: |
          set -o pipefail
          go test -race -json -count=1 ./... | tee go-test-race.jsonl
      - name: PowerShell 具名通過與禁止跳過
        run: python3 -B scripts/check_go_test_events.py go-test.jsonl go-test-race.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: go-test-events-${{ matrix.os }}
          path: |
            go-test.jsonl
            go-test-race.jsonl
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snapshot-archives
          path: dist
      - name: 隔離原生壓縮檔安裝與設定保留
        run: python3 -B scripts/install_check.py
      - name: 原生 CLI
        run: |
          go build -o native-tlscheck.exe ./cmd/tlscheck
          ./native-tlscheck.exe --version
  html-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 確認 PowerShell 引擎
        run: pwsh -NoProfile -NonInteractive -Command "\$PSVersionTable.PSVersion.ToString()"
      - name: HTML 離線驗收腳本回歸
        run: python3 -B -m unittest -v scripts/test_html_acceptance.py
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.14.3
          install-only: true
      - name: GoReleaser 版本與設定檢查
        run: |
          goreleaser --version
          goreleaser check
      - name: Workflow 語法檢查
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 -B scripts/lint_workflows.py
      - name: 四目標無發佈試建置
        run: |
          goreleaser release --snapshot --clean --skip=publish
          python3 scripts/release.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
